function gl(){$("#gl").innerHTML=S.gal.map((g,i)=>`<div class="gi"><img src="${esc(g.url)}" alt=""><input placeholder="Caption EN" value="${esc(g.cap.en)}"><input placeholder="ক্যাপশন বাংলা" value="${esc(g.cap.bn)}"><select aria-label="Category"><option value="">General</option><option value="event"${g.c==="event"?" selected":""}>Office Event</option></select><button data-del="${i}" aria-label="Delete">✕</button></div>`).join("")}
function dash(){const d=document.createElement("div");d.id="dash";
d.innerHTML=`<div class="pn"><h3>Dashboard</h3>`+f("nE","Name (EN)",S.name.en)+f("nB","নাম (বাংলা)",S.name.bn)+f("tE","Title (EN)",S.title.en)+f("tB","পদবি (বাংলা)",S.title.bn)+f("lE","Location (EN)",S.loc.en)+f("lB","ঠিকানা (বাংলা)",S.loc.bn)+f("aE","About (EN)",S.about.en,4)+f("aB","পরিচিতি (বাংলা)",S.about.bn,4)+f("em","Email",S.email)+f("ph","Phone",S.phone)+f("xp","Experience — one per line: Role EN | পদবি বাংলা | Organization | Years",lines(S.exp),4)+f("ed","Education — same format",lines(S.edu),3)+f("sk","Skills (comma separated)",S.skills.join(", "))+`<h4>Gallery</h4><div id="gl"></div><label>Upload photo<input type="file" id="up" accept="image/*"></label><div class="row"><button class="btn" id="sv">Save &amp; Publish</button><button class="btn o" id="cl">Close</button></div></div>`;
document.body.append(d);gl();
$("#cl").onclick=()=>d.remove();
$("#up").onchange=async e=>{try{const a=await claude.use("assets");if(!a)return toast("Upload unavailable");sync();const r=await a.upload(e.target.files[0]);S.gal.push({url:r.url,cap:{en:"",bn:""}});gl()}catch(x){toast(x.message||"Upload failed")}};
$("#gl").onclick=e=>{const i=e.target.dataset.del;if(i!==undefined){sync();S.gal.splice(+i,1);gl()}};
$("#sv").onclick=async()=>{sync();S.name={en:v("nE"),bn:v("nB")};S.title={en:v("tE"),bn:v("tB")};S.loc={en:v("lE"),bn:v("lB")};S.about={en:v("aE"),bn:v("aB")};S.email=v("em");S.phone=v("ph");S.exp=parse($("#xp").value);S.edu=parse($("#ed").value);S.skills=v("sk").split(",").map(s=>s.trim()).filter(Boolean);
try{const a=await claude.use("artifact");if(!a)return toast("Publish unavailable");await a.publish(doc(S))}catch(x){toast(x.code==="conflict"?"Changed elsewhere — reload and retry":x.message||"Save failed")}}}
function lb(src){const o=document.createElement("div");o.id="lb";o.innerHTML=`<img src="${esc(src)}" alt="">`;o.onclick=()=>o.remove();document.body.append(o)}
function upd(){const n=$("#mn").value.trim(),m=$("#mm").value.trim(),b=(n?n+": ":"")+m,ph=S.phone.split(",")[0].trim();$("#ms").href="sms:+88"+ph+"?body="+encodeURIComponent(b);$("#mw").href="https://wa.me/88"+ph+"?text="+encodeURIComponent(b);$("#me").href="mailto:"+S.email+"?subject="+encodeURIComponent("Message from "+(n||"website visitor"))+"&body="+encodeURIComponent(m+(n?" — "+n:""))}
document.addEventListener("input",e=>{if(/^m[nm]$/.test(e.target.id))upd()});
$("#app").innerHTML=render(S);upd();setL("en");
document.addEventListener("click",async e=>{const t=e.target;
if(t.id==="lang")setL(document.body.dataset.l==="bn"?"en":"bn");
else if(t.id==="adm"){const u=window.claude?await claude.use("user"):null;if(u&&u.canEdit())dash();else toast("শুধু সাইটের মালিক Claude-এ সাইন-ইন করে অ্যাডমিন ড্যাশবোর্ড খুলতে পারবেন। / Admin access is for the site owner signed in to Claude.")}
else if(t.dataset.f!==undefined&&t.closest(".tabs")){document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b===t));document.querySelectorAll(".gal figure[data-c]").forEach(f=>f.hidden=!!t.dataset.f&&f.dataset.c!==t.dataset.f)}
else if(t.matches(".gal img"))lb(t.src)});
})();
</script></body></html>
